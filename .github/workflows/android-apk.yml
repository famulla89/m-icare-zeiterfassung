name: M-iCare Android APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-apk.yml'
      - 'index.html'
      - 'login-gate.js'
      - 'google-company-search.js'
      - 'schedule-planner.js'
      - 'quote-calculator.js'
      - 'quote-ui.js'
      - 'billing-ui.js'
      - 'operations-core.js'
      - 'operations-ui.js'
      - 'voice-input.js'
      - 'report-print.js'
      - 'logo.svg'
  push:
    paths:
      - 'android-app/**'
      - 'index.html'
      - 'login-gate.js'
      - 'google-company-search.js'
      - 'schedule-planner.js'
      - 'cloud-transfer.js'
      - 'quote-calculator.js'
      - 'tests/quote-calculator-smoke.cjs'
      - 'quote-ui.js'
      - 'billing-ui.js'
      - 'operations-core.js'
      - 'operations-ui.js'
      - 'tests/operations-core-smoke.cjs'
      - 'voice-input.js'
      - 'report-print.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'logo.svg'
      - '.github/workflows/android-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "::error::Android SDK command line tools missing in $SDK_ROOT"; exit 1; fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle current offline web app
        run: |
          mkdir -p android-app/app/src/main/assets
          cp index.html login-gate.js google-company-search.js schedule-planner.js cloud-transfer.js quote-calculator.js quote-ui.js billing-ui.js operations-core.js operations-ui.js voice-input.js report-print.js sw.js manifest.webmanifest icon.svg logo.svg android-app/app/src/main/assets/
      - name: Configure pinned M-iCare test APK signing
        shell: bash
        env:
          MICARE_DEBUG_KEYSTORE_BASE64: ${{ secrets.MICARE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${MICARE_DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::MICARE_DEBUG_KEYSTORE_BASE64 fehlt: Nur NEUINSTALLATIONS-Test-APK, kein verlässliches Android-Update."
            echo "MICARE_SIGNING_KIND=TEMPORAER" >> "$GITHUB_ENV"
            echo "MICARE_ARTIFACT_NAME=M-iCare-TEST-1.9.14-NEUINSTALLATION" >> "$GITHUB_ENV"
          else
            mkdir -p "$HOME/.android"
            printf '%s' "$MICARE_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android >/dev/null
            ACTUAL_CERT_SHA256="$(keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null | sha256sum | awk '{print $1}')"
            EXPECTED_CERT_SHA256="422d32cd1b257b9519ca63d6c16dd7b736a8f02671e1010843d02ae450c1c5a5"
            if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::Der GitHub-Secret-Schlüssel stimmt nicht mit dem festgelegten M-iCare-Testzertifikat überein. Build gestoppt, um falsche Update-Signaturen zu verhindern."
              exit 1
            fi
            echo "MICARE_SIGNING_KIND=FEST" >> "$GITHUB_ENV"
            echo "MICARE_ARTIFACT_NAME=M-iCare-UPDATE-1.9.14-FESTE-SIGNATUR" >> "$GITHUB_ENV"
            echo "PASS: correct pinned persistent test signing certificate"
          fi
      - name: Build APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify calculator, cloud backup and normal M-iCare app identifier
        shell: bash
        run: |
          set -euo pipefail
          node tests/quote-calculator-smoke.cjs
          node --check login-gate.js
          node --check billing-ui.js
          node --check operations-core.js
          node --check operations-ui.js
          node tests/operations-core-smoke.cjs
          node tests/billing-core-smoke.cjs
          node tests/voice-input-smoke.cjs
          node tests/schedule-planner-smoke.cjs
          node tests/cloud-transfer-smoke.cjs
          node tests/app-core-smoke.cjs
          node tests/logic-fuzz-smoke.cjs
          node tests/reporting-smoke.cjs
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/micare-apk-badging.txt
          grep -Fq "package: name='de.micare.zeiterfassung'" /tmp/micare-apk-badging.txt
          grep -Fq "application-label:'M-iCare'" /tmp/micare-apk-badging.txt
          unzip -p "$APK" assets/index.html | grep -Fq 'data-jump="quoteCalculator"'
          unzip -p "$APK" assets/index.html | cmp - index.html
          unzip -p "$APK" assets/index.html | grep -Fq 'Betriebsverwaltung'
          unzip -p "$APK" assets/index.html | grep -Fq 'M-iCare Gebäudereinigung · Version 1.9.14'
          for screen in customerOverviewScreen appointmentsPanel plannedWorkScreen billingScreen operationsHub; do
            grep -Fq "data-jump=\"$screen\"" index.html
            grep -Fq "id=\"$screen\"" index.html
          done
          grep -Fq 'id="micareMainNavigation"' index.html
          grep -Fq 'id="homeCustomerCount"' index.html
          echo 'PASS: solo-operator main navigation and work dashboard present'
          unzip -p "$APK" assets/index.html | grep -Fq '<script src="./google-company-search.js"></script>'
          unzip -l "$APK" | grep -Fq 'assets/login-gate.js'
          unzip -l "$APK" | grep -Fq 'assets/google-company-search.js'
          unzip -l "$APK" | grep -Fq 'assets/quote-calculator.js'
          unzip -l "$APK" | grep -Fq 'assets/quote-ui.js'
          unzip -l "$APK" | grep -Fq 'assets/billing-ui.js'
          unzip -l "$APK" | grep -Fq 'assets/operations-core.js'
          unzip -l "$APK" | grep -Fq 'assets/operations-ui.js'
          unzip -p "$APK" assets/operations-core.js | cmp - operations-core.js
          unzip -p "$APK" assets/operations-ui.js | cmp - operations-ui.js
          echo 'PASS: exact operations scripts embedded in Android APK'
          unzip -l "$APK" | grep -Fq 'assets/voice-input.js'
          unzip -l "$APK" | grep -Fq 'assets/report-print.js'
          unzip -l "$APK" | grep -Fq 'assets/cloud-transfer.js'
          echo 'PASS: normal M-iCare package, calculator UI, offers and cloud-transfer bundled'
      - name: Verify actual APK signature and record signing status
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify "$APK"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          APK_CERT_SHA256="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | head -n 1)"
          test -n "$APK_CERT_SHA256"
          KEYSTORE_CERT_SHA256="$(keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null | sha256sum | awk '{print $1}')"
          if [ "$APK_CERT_SHA256" != "$KEYSTORE_CERT_SHA256" ]; then
            echo "::error::Die APK wurde nicht mit dem erwarteten Debug-Keystore signiert."
            exit 1
          fi
          if [ "$MICARE_SIGNING_KIND" = "FEST" ]; then
            test "$APK_CERT_SHA256" = "422d32cd1b257b9519ca63d6c16dd7b736a8f02671e1010843d02ae450c1c5a5"
            UPDATE_TEXT="Gleicher fester Testschluessel: Update ab der ersten damit signierten Installation moeglich."
          else
            UPDATE_TEXT="Temporare Runner-Signatur: nur Neuinstallation; vor dem Entfernen alter Apps externes JSON-Backup erstellen."
            echo "::warning::$UPDATE_TEXT"
          fi
          APK_FILE_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          printf 'M-iCare Android 1.9.14\nSignaturstatus: %s\nZertifikat SHA-256: %s\nAPK SHA-256: %s\n%s\n' "$MICARE_SIGNING_KIND" "$APK_CERT_SHA256" "$APK_FILE_SHA256" "$UPDATE_TEXT" > M-iCare-APK-Signaturstatus.txt
          cat M-iCare-APK-Signaturstatus.txt
      - name: Give APK a unique recognizable filename
        shell: bash
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk M-iCare-NEU-1.9.14-Android.apk
          test -s M-iCare-NEU-1.9.14-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MICARE_ARTIFACT_NAME }}
          path: |
            M-iCare-NEU-1.9.14-Android.apk
            M-iCare-APK-Signaturstatus.txt
          retention-days: 30
