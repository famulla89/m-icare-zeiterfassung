name: M-iCare Browser E2E Regression
on:
  workflow_dispatch:
  push:
    branches:
      - feature/audited-order-corrections-20261024
    paths:
      - index.html
      - cloud-transfer.js
      - quote-calculator.js
      - quote-ui.js
      - tests/browser-e2e.cjs
      - tests/customer-to-billing-report-e2e.cjs
      - tests/chaos-input-e2e.cjs
      - tests/quote-calculator-smoke.cjs
      - .github/workflows/browser-e2e.yml
  pull_request:
    paths:
      - index.html
      - tests/browser-e2e.cjs
      - .github/workflows/browser-e2e.yml
jobs:
  chromium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save --no-audit --no-fund playwright
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Test customer, worktime, planned correction, reporting, PDF, backup
        run: |
          node tests/quote-calculator-smoke.cjs
          node tests/browser-e2e.cjs
          node tests/customer-to-billing-report-e2e.cjs
          node tests/chaos-input-e2e.cjs

      - name: Publish synthetic AK report examples for PDF/CSV review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M-iCare-AK-Reporting-Testausdrucke
          path: test-output/
          if-no-files-found: warn
          retention-days: 14
