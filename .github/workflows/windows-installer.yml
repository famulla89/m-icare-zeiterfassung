name: M-iCare Windows Installer
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'index.html'
      - 'login-gate.js'
      - 'schedule-planner.js'
      - 'quote-calculator.js'
      - 'quote-ui.js'
      - 'report-print.js'
      - 'logo.svg'
  push:
    paths:
      - 'windows-app/**'
      - 'index.html'
      - 'login-gate.js'
      - 'schedule-planner.js'
      - 'cloud-transfer.js'
      - 'quote-calculator.js'
      - 'quote-ui.js'
      - 'report-print.js'
      - 'tests/quote-calculator-smoke.cjs'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'logo.svg'
      - '.github/workflows/windows-installer.yml'
      - 'tests/windows-installer-smoke.ps1'
      - 'tests/windows-electron-e2e.cjs'
      - 'tests/cloud-transfer-smoke.cjs'
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy offline web app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-app/web | Out-Null
          Copy-Item index.html,login-gate.js,schedule-planner.js,cloud-transfer.js,quote-calculator.js,quote-ui.js,report-print.js,manifest.webmanifest,icon.svg,logo.svg windows-app/web/
      - name: Validate business rules and correction flows on Windows
        shell: pwsh
        run: |
          node tests/app-core-smoke.cjs
          node tests/order-correction-smoke.cjs
          node tests/reporting-smoke.cjs
          node tests/cloud-transfer-smoke.cjs
          node tests/quote-calculator-smoke.cjs
          node --check login-gate.js
          node tests/logic-fuzz-smoke.cjs
          node --check tests/browser-e2e.cjs
      - name: Install dependencies
        working-directory: windows-app
        run: npm install --no-fund
      - name: Audit dependency tree (block high / critical vulnerabilities)
        working-directory: windows-app
        run: npm audit --audit-level=high
      - name: Build offline Windows installer
        working-directory: windows-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - name: Produce SHA-256 checksum and signing report
        shell: pwsh
        run: |
          Get-ChildItem windows-app/dist/M-iCare-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content windows-app/dist/SHA256SUMS.txt
            $signature = Get-AuthenticodeSignature $_.FullName
            "Installer: $($_.Name); Signature status: $($signature.Status); Signer: $($signature.SignerCertificate.Subject)" | Add-Content windows-app/dist/SIGNATURE_STATUS.txt
          }
      - name: Validate packaged app and silently install Windows EXE on isolated runner
        shell: pwsh
        run: ./tests/windows-installer-smoke.ps1
      - name: Test installed Electron app with Playwright (Windows)
        shell: pwsh
        run: |
          Push-Location windows-app
          try {
            npm install --no-save --no-audit --no-fund playwright
            if ($LASTEXITCODE -ne 0) { throw 'Playwright installation failed' }
          } finally { Pop-Location }
          node tests/windows-electron-e2e.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: M-iCare-Windows-Setup-UNSIGNED-TEST
          path: |
            windows-app/dist/M-iCare-Setup-*.exe
            windows-app/dist/SHA256SUMS.txt
            windows-app/dist/SIGNATURE_STATUS.txt
          retention-days: 30
